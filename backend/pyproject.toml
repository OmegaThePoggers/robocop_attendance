[project]
name = "face-recognition-attendance-backend"
version = "0.1.0"
description = "Backend for the Face Recognition Attendance System."
requires-python = "==3.9.*"
dependencies = [
    "fastapi>=0.100.0,<0.112.0",
    "uvicorn[standard]>=0.20.0,<0.30.0",
    "numpy==1.26.4",
    "setuptools",
    "python-multipart",
    "opencv-python-headless",
    "insightface==0.7.3",
    "onnxruntime==1.17.1",
    "faiss-cpu==1.8.0",
    "pgvector",
    "sqlmodel",
    "passlib[argon2]",
    "python-jose[cryptography]",
    "slowapi",
    "psycopg2-binary"
]
