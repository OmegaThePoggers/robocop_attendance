services:
  db:
    image: postgres:15-alpine
    container_name: robocop_db
    restart: always
    environment:
      POSTGRES_USER: robocop_user
      POSTGRES_PASSWORD: robocop_password
      POSTGRES_DB: robocop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U robocop_user -d robocop_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: robocop_backend
    ports:
      - "8000:8000"
    volumes:
      # Mount dataset for facial recognition images
      - ./dataset:/app/dataset
      # Mount static files to serve evidence/crops
      - ./backend/static:/app/static
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DATASET_PATH=/app/dataset
      - DATABASE_URL=postgresql://robocop_user:robocop_password@db:5432/robocop_db
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-next
    container_name: robocop_frontend
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot-reloading
      - ./frontend-next/src:/app/src
      - ./frontend-next/public:/app/public
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
